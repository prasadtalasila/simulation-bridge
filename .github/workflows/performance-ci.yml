name: Agents Performance CI

on:
  pull_request:
    paths:
      - "agents/performance/**"
      - ".github/workflows/performance-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest

    # All commands run inside the performance tooling directory
    defaults:
      run:
        working-directory: agents/performance

    steps:
      # ───── 1. Checkout ─────
      - uses: actions/checkout@v4

      # ───── 2. Python ─────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ───── 3. Install dependencies ─────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest pytest-cov

      # ───── 4. Lint ─────
      - name: Run pylint (min score 9.0)
        run: pylint generate_performance_data.py performance_analysis.py --fail-under=9

      # ───── 5. Regenerate logs and plots ─────
      - name: Generate performance data and plots
        run: |
          python generate_performance_data.py
          python performance_analysis.py

      # ───── 6. Tests ─────
      - name: Run pytest (with coverage)
        run: pytest --cov=. --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: agents/performance/coverage.xml
          flags: performance
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
